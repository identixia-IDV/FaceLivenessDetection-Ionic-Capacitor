// Consumes Identixia Face Recognition AAR (same as FaceRecognition-LivenessDetection-Android).
// Drop facelivenesssdk.aar here from the Android Drive folder.
def aar = file("facelivenesssdk.aar")
if (!aar.exists()) {
    throw new GradleException(
        "Missing example/android/libfacelivenesssdk/facelivenesssdk.aar.\n" +
        "Copy it from FaceRecognition-LivenessDetection-Android/libfacelivenesssdk/ or the Drive Android pack."
    )
}
configurations.maybeCreate("default")
artifacts.add("default", aar)
