ext {
  junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
  androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.6.1'
  androidxJunitVersion = project.hasProperty('androidxJunitVersion') ? rootProject.ext.androidxJunitVersion : '1.1.5'
  androidxEspressoCoreVersion = project.hasProperty('androidxEspressoCoreVersion') ? rootProject.ext.androidxEspressoCoreVersion : '3.5.1'
  cordovaAndroidVersion = project.hasProperty('cordovaAndroidVersion') ? rootProject.ext.cordovaAndroidVersion : '10.1.1'
}

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath 'com.android.tools.build:gradle:8.2.1'
    classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
  }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
  namespace "com.facerecognitionsdk"
  compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 34
  defaultConfig {
    minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
    targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 34
    versionCode 1
    versionName "0.1.0"
  }
  buildTypes {
    release {
      minifyEnabled false
    }
  }
  lintOptions {
    abortOnError false
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}

repositories {
  google()
  mavenCentral()
}

def bundledAar = file("${projectDir}/libs/facelivenesssdk.aar")

dependencies {
  implementation fileTree(dir: 'libs', include: ['*.jar'])
  implementation project(':capacitor-android')
  implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  // 1.4.2+ ships 16 KB–aligned libimage_processing_util_jni.so (Play / Android 15+)
  def camerax = '1.4.2'
  implementation "androidx.camera:camera-core:$camerax"
  implementation "androidx.camera:camera-camera2:$camerax"
  implementation "androidx.camera:camera-lifecycle:$camerax"
  implementation "androidx.camera:camera-view:$camerax"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.22"
  if (bundledAar.exists()) {
    implementation files(bundledAar)
  } else if (findProject(':libfacelivenesssdk') != null) {
    implementation project(path: ':libfacelivenesssdk')
  } else {
    def fetched = file("${projectDir}/libs/facelivenesssdk.aar")
    fetched.parentFile.mkdirs()
    def zipFile = file("${projectDir}/libs/facelivenesssdk-android.zip")
    try {
      new URL("https://github.com/identixia-IDV/FaceRecognition-LivenessDetection-Android/releases/latest/download/facelivenesssdk-android.zip").withInputStream { input ->
        zipFile.withOutputStream { out -> out << input }
      }
      copy {
        from zipTree(zipFile)
        into file("${projectDir}/libs")
      }
    } catch (Exception e) {
      throw new GradleException(
        "Missing facelivenesssdk.aar.\n" +
        "Demo: example/android/libfacelivenesssdk/facelivenesssdk.aar\n" +
        "Own app: https://raw.githubusercontent.com/identixia-IDV/FaceRecognition-LivenessDetection-Android/v1.0.0/install.gradle\n" +
        e.message
      )
    }
    if (!fetched.exists()) {
      throw new GradleException("facelivenesssdk.aar was not in the Latest Release zip.")
    }
    implementation files(fetched)
  }
  testImplementation "junit:junit:$junitVersion"
  androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
  androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

// Engine packs (.xdb) are not inside the AAR — stage as assets/facelivenesssdk/
// so every consumer APK (example) can init (same pattern as Flutter plugin).
def _ixDbCandidates = []
if (findProject(":libfacelivenesssdk") != null) {
  _ixDbCandidates << file("${findProject(":libfacelivenesssdk").projectDir}/databases")
}
_ixDbCandidates << file("${projectDir}/libs/databases")
_ixDbCandidates << file("${projectDir}/../example/android/libfacelivenesssdk/databases")
def _ixDbSrc = _ixDbCandidates.find { it != null && it.isDirectory() && it.listFiles()?.any { f -> f.name.endsWith(".xdb") } }
if (_ixDbSrc != null) {
  def _ixPacksOut = file("${projectDir}/build/generated/identixiaAssets")
  def _ixDest = file("${_ixPacksOut}/facelivenesssdk")
  _ixDest.mkdirs()
  _ixDbSrc.eachFileMatch(~/.*\.xdb/) { src ->
    def out = new File(_ixDest, src.name)
    if (!out.exists() || out.length() != src.length()) {
      java.nio.file.Files.copy(src.toPath(), out.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
  }
  android.sourceSets.main.assets.srcDir(_ixPacksOut)
  println("[identixia] staged face packs from ${_ixDbSrc} -> assets/facelivenesssdk")
}

